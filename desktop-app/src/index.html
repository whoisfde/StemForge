<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StemForge</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <div class="app">
      <header class="app-header">
        <img class="brand-logo" src="/assets/logo-lockup.png" alt="StemForge" />
      </header>

      <div class="app-content">
        <section class="panel">
          <div class="section-title">Companion Server</div>
          <div id="status-view">
            <div class="status-row">
              <span class="spinner"></span>
              <span>Checking...</span>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="section-title">Updates</div>
          <div id="update-status-view"></div>
        </section>
      </div>
    </div>
  </body>
</html>
